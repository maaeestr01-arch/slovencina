<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>Slovenčina — kurz A1 → B2</title>
<style>:root{
  --bg:#f5f7f8; --card:#ffffff; --ink:#111827; --muted:#6b7280;
  --line:#e4e7eb; --accent:#0f766e; --accent-ink:#ffffff;
  --ok:#15803d; --ok-bg:#e8f5ec; --bad:#b91c1c; --bad-bg:#fdecec;
  --warn:#b45309; --warn-bg:#fdf3e2; --radius:14px;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.08);
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0e1113; --card:#171b1e; --ink:#e8eaed; --muted:#9aa4ad;
    --line:#2a3034; --accent:#2dd4bf; --accent-ink:#04201d;
    --ok:#6ee7a8; --ok-bg:#10291b; --bad:#fca5a5; --bad-bg:#2a1212;
    --warn:#fcd34d; --warn-bg:#2a2110;
    --shadow:0 1px 2px rgba(0,0,0,.4);
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  -webkit-text-size-adjust:100%;
}
.app{max-width:760px;margin:0 auto;padding:0 14px 96px}
a{color:inherit;text-decoration:none}
h1{font-size:22px;line-height:1.25;margin:0 0 4px}
h2{font-size:17px;margin:0 0 10px}
h3{font-size:15px;margin:18px 0 8px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
p{margin:0 0 10px}
.muted{color:var(--muted)}
.small{font-size:13px}
.hidden{display:none!important}

/* header */
.hdr{
  position:sticky;top:0;z-index:20;background:var(--bg);
  display:flex;align-items:center;justify-content:space-between;
  padding:12px 0 10px;border-bottom:1px solid var(--line);margin-bottom:14px;
}
.brand{font-weight:700;font-size:17px;letter-spacing:.2px}
.brand span{color:var(--accent)}
.chip{
  display:inline-flex;align-items:center;gap:6px;font-size:13px;
  background:var(--card);border:1px solid var(--line);border-radius:999px;
  padding:5px 12px;color:var(--muted)
}
.chip b{color:var(--ink)}

/* nav */
.nav{
  position:fixed;left:0;right:0;bottom:0;z-index:30;
  background:var(--card);border-top:1px solid var(--line);
  display:flex;justify-content:space-around;
  padding:6px 4px calc(6px + env(safe-area-inset-bottom));
}
.nav a{
  flex:1;text-align:center;font-size:11px;color:var(--muted);
  padding:4px 2px;border-radius:10px;line-height:1.2;
}
.nav a .ic{display:block;font-size:18px;margin-bottom:2px}
.nav a.on{color:var(--accent);font-weight:600}

/* cards & sections */
.card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:16px;margin-bottom:12px;box-shadow:var(--shadow);
}
.sec{margin-bottom:18px}
.prose{font-size:16px}
.prose b{color:var(--ink)}
.prose .sk{color:var(--accent);font-weight:600}
.prose ul{margin:6px 0 10px;padding-left:20px}
.prose li{margin:3px 0}
.prose table{margin:8px 0}
.prose .note{
  background:var(--warn-bg);border-left:3px solid var(--warn);
  padding:10px 12px;border-radius:0 10px 10px 0;font-size:14px;margin:10px 0
}

/* buttons */
.btn{
  appearance:none;border:0;border-radius:12px;padding:13px 18px;
  font-size:15px;font-weight:600;background:var(--accent);color:var(--accent-ink);
  cursor:pointer;min-height:46px;transition:opacity .15s;
}
.btn:active{opacity:.8}
.btn.sm{padding:9px 14px;font-size:14px;min-height:40px;border-radius:10px}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.soft{background:var(--ok-bg);color:var(--ok)}
.btn.wide{width:100%;display:block;margin-top:8px}
.btn[disabled]{opacity:.5;pointer-events:none}
.row{display:flex;gap:8px;align-items:center}
.row .btn{flex:0 0 auto}

/* progress */
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin:10px 0}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}

/* stats grid */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.stat b{display:block;font-size:22px;line-height:1.2}
.stat span{font-size:12px;color:var(--muted)}

/* unit list */
.ulist{list-style:none;margin:0;padding:0}
.ulist li{margin-bottom:8px}
.uitem{
  display:flex;gap:12px;align-items:center;background:var(--card);
  border:1px solid var(--line);border-radius:12px;padding:12px 14px;
}
.uitem .num{
  width:32px;height:32px;flex:0 0 32px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  background:var(--bg);border:1px solid var(--line);font-size:13px;font-weight:700;color:var(--muted)
}
.uitem.done .num{background:var(--ok-bg);color:var(--ok);border-color:transparent}
.uitem .tt{font-size:15px;font-weight:600;line-height:1.3}
.uitem .sub{font-size:12px;color:var(--muted)}
.uitem .st{margin-left:auto;font-size:12px;color:var(--muted);text-align:right}

/* tables */
table.tbl{width:100%;border-collapse:collapse;font-size:14px;margin:6px 0}
table.tbl th,table.tbl td{border:1px solid var(--line);padding:7px 9px;text-align:left}
table.tbl th{background:var(--bg);font-weight:600;font-size:13px;color:var(--muted)}
table.tbl td.sk{font-weight:600}

/* vocab */
.vocab{display:flex;flex-direction:column;gap:2px}
.vrow{
  padding:10px 2px;border-bottom:1px solid var(--line);
  display:grid;grid-template-columns:auto 1fr auto;gap:2px 10px;align-items:baseline;
}
.vrow:last-child{border-bottom:0}
.vsk{font-weight:600;font-size:16px}
.vru{color:var(--muted);font-size:14px;text-align:right}
.vex{grid-column:1/3;font-size:13px;color:var(--muted);margin-top:4px}
.vex .muted{opacity:.8}
.spk{
  appearance:none;border:1px solid var(--line);background:var(--bg);
  border-radius:8px;width:34px;height:30px;font-size:14px;cursor:pointer;color:var(--muted)
}

/* exercises */
.ex{
  background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:14px;margin-bottom:12px;box-shadow:var(--shadow)
}
.ex-q{font-size:15px;margin-bottom:10px;line-height:1.45}
.ex-q .sk{color:var(--accent)}
.inp{
  width:100%;padding:12px 14px;border-radius:10px;border:1px solid var(--line);
  background:var(--bg);color:var(--ink);font-size:16px;outline:none;
  min-height:46px;
}
.inp:focus{border-color:var(--accent)}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{
  appearance:none;text-align:left;padding:12px 14px;border-radius:10px;
  border:1px solid var(--line);background:var(--bg);color:var(--ink);
  font-size:15px;cursor:pointer;min-height:44px;
}
.opt.good{border-color:var(--ok);background:var(--ok-bg);color:var(--ok);font-weight:600}
.opt.bad{border-color:var(--bad);background:var(--bad-bg);color:var(--bad)}
.fb{margin-top:10px;font-size:14px;line-height:1.4}
.fb.ok{color:var(--ok)}
.fb.bad{color:var(--bad)}
.fb .why{display:block;color:var(--muted);margin-top:3px}

/* match */
.match{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mcell{
  appearance:none;padding:10px;border-radius:10px;border:1px solid var(--line);
  background:var(--bg);color:var(--ink);font-size:14px;cursor:pointer;text-align:left
}
.mcell.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}
.mcell.done{opacity:.45;pointer-events:none}

/* order */
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.chipw{
  appearance:none;border:1px solid var(--line);background:var(--bg);color:var(--ink);
  padding:8px 11px;border-radius:9px;font-size:14px;cursor:pointer
}
.chipw.used{opacity:.3;pointer-events:none}
.answerline{
  min-height:44px;border:1px dashed var(--line);border-radius:10px;
  padding:6px;display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px
}
.answerline .chipw{background:var(--card)}

/* review */
.rv-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;font-size:13px;color:var(--muted)}
.rvcard{
  background:var(--card);border:1px solid var(--line);border-radius:16px;
  padding:26px 18px;text-align:center;box-shadow:var(--shadow);min-height:190px;
  display:flex;flex-direction:column;justify-content:center;gap:10px
}
.rv-front{font-size:26px;font-weight:700;line-height:1.25}
.rv-back{font-size:20px;color:var(--accent);font-weight:600}
.rv-ex{font-size:14px;color:var(--muted);margin-top:6px}
.grades{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:14px}
.grades .btn{padding:12px 6px;font-size:14px}
.g-again{background:var(--bad-bg);color:var(--bad)}
.g-good{background:var(--accent)}
.g-easy{background:var(--ok-bg);color:var(--ok)}

/* heatmap */
.heat{display:grid;grid-template-columns:repeat(14,1fr);gap:4px;margin:8px 0}
.heat i{aspect-ratio:1;border-radius:3px;background:var(--line);display:block}
.heat i.l1{background:#a7d8cf}.heat i.l2{background:#5bb8a8}.heat i.l3{background:var(--accent)}
@media (prefers-color-scheme:dark){.heat i.l1{background:#134e4a}.heat i.l2{background:#0f766e}.heat i.l3{background:#2dd4bf}}

/* toast */
.toast{
  position:fixed;left:50%;bottom:84px;transform:translate(-50%,20px);
  background:#111827;color:#fff;padding:10px 16px;border-radius:10px;
  font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:50;max-width:90vw
}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-color-scheme:dark){.toast{background:#e8eaed;color:#111827}}

/* settings */
.field{margin-bottom:16px}
.field label{display:block;font-size:14px;color:var(--muted);margin-bottom:6px}
.hr{height:1px;background:var(--line);margin:18px 0}
.danger{color:var(--bad)}

/* reading */
.reading{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
.reading .txt{font-size:16px;line-height:1.65}
.qa{margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.qa .q{font-weight:600;font-size:14px;margin-bottom:4px}
.qa .a{color:var(--muted);font-size:14px}

/* unit head */
.crumb{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px}
.uhead{margin:4px 0 16px}
.uhead .ru{color:var(--muted);font-size:15px}
</style>
</head>
<body>
<div id="app" class="app"></div>
<script>/* Простой SM-2-подобный планировщик. Без зависимостей. */
(function (root) {
  'use strict';

  function pad(n) { return (n < 10 ? '0' : '') + n; }

  function todayStr(d) {
    d = d || new Date();
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  }

  function parse(s) {
    var p = String(s).split('-').map(Number);
    return new Date(p[0], p[1] - 1, p[2]);
  }

  function addDays(s, n) {
    var d = parse(s);
    d.setDate(d.getDate() + n);
    return todayStr(d);
  }

  function diffDays(a, b) {
    return Math.round((parse(b) - parse(a)) / 86400000);
  }

  function newState() {
    return { ef: 2.5, iv: 0, due: null, reps: 0, lapses: 0 };
  }

  /* g: 0 = снова, 1 = хорошо, 2 = легко */
  function grade(st, g, today) {
    st = Object.assign(newState(), st || {});
    today = today || todayStr();

    if (g === 0) {
      st.lapses += 1;
      st.reps = 0;
      st.ef = Math.max(1.3, st.ef - 0.2);
      st.iv = 0;
      st.due = today;
      return st;
    }

    st.reps += 1;
    if (g === 1) {
      if (st.reps === 1) st.iv = 1;
      else if (st.reps === 2) st.iv = 3;
      else st.iv = Math.max(1, Math.round((st.iv || 1) * st.ef));
      st.due = addDays(today, st.iv);
    } else {
      if (st.reps === 1) st.iv = 2;
      else st.iv = Math.max(2, Math.round((st.iv || 1) * st.ef * 1.3));
      st.ef = Math.min(3.0, st.ef + 0.05);
      st.due = addDays(today, st.iv);
    }
    return st;
  }

  function isDue(st, today) {
    return !!(st && st.due && st.due <= (today || todayStr()));
  }

  root.SRS = {
    todayStr: todayStr,
    addDays: addDays,
    diffDays: diffDays,
    parse: parse,
    newState: newState,
    grade: grade,
    isDue: isDue
  };
})(typeof globalThis !== 'undefined' ? globalThis : this);
</script>
<script>window.COURSE = { units: [] };
COURSE.units.push({
  n: 1,
  week: 1,
  minutes: 45,
  title: 'Výslovnosť a sloveso byť',
  ru: 'Произношение и глагол «быть»',
  goal: 'К концу юнита: уверенно читаешь словацкий текст, ставишь ударение на первый слог, спрягаешь byť в утверждении и отрицании, здороваешься и представляешься.',
  theory: [
    {
      h: 'Как читать по-словацки',
      html: '<p>Алфавит: <span class="sk">a á ä b c č d ď dz dž e é f g h ch i í j k l ĺ ľ m n ň o ó ô p r ŕ s š t ť u ú v y ý z ž</span>.</p>' +
        '<ul>' +
        '<li><span class="sk">y / ý</span> читаются так же, как <span class="sk">i / í</span> — звук [i].</li>' +
        '<li><span class="sk">ch</span> — одна буква, звук [х]: <span class="sk">chlieb</span> [хлеб] «хлеб».</li>' +
        '<li><span class="sk">h</span> — звонкое [г] (как в украинском), <span class="sk">g</span> — обычное [g].</li>' +
        '<li><span class="sk">c</span> [ц], <span class="sk">č</span> [ч], <span class="sk">š</span> [ш], <span class="sk">ž</span> [ж], <span class="sk">dz</span> [дз], <span class="sk">dž</span> [дж].</li>' +
        '<li><span class="sk">ď, ť, ň, ľ</span> — мягкие [дь, ть, нь, ль].</li>' +
        '<li><span class="sk">ô</span> — [уо]: <span class="sk">stôl</span> [стуол] «стол».</li>' +
        '</ul>' +
        '<div class="note">В словацком нет буквы <span class="sk">ř</span> и нет звука «ы». Не переноси русское чтение: <span class="sk">y</span> — это [i].</div>'
    },
    {
      h: 'Долгота и дифтонги',
      html: '<p>Долгие гласные <span class="sk">á é í ó ú ý</span> тянутся примерно вдвое дольше кратких. Долгота меняет смысл слова:</p>' +
        '<ul>' +
        '<li><span class="sk">byt</span> «квартира» — <span class="sk">biť</span> «бить»;</li>' +
        '<li><span class="sk">pas</span> «паспорт» — <span class="sk">pás</span> «пояс»;</li>' +
        '<li><span class="sk">sud</span> «бочка» — <span class="sk">súd</span> «суд».</li>' +
        '</ul>' +
        '<p>Дифтонги <span class="sk">ia, ie, iu</span> — это один слог: <span class="sk">viac</span> [вйац] «больше», <span class="sk">nie</span> [нье] «нет», <span class="sk">dieťa</span> [дьетьа] «ребёнок».</p>'
    },
    {
      h: 'Ударение и ритмический закон',
      html: '<p>Ударение всегда на первом слоге: <span class="sk">DObrý deň</span>, <span class="sk">ŠTUdent</span>, <span class="sk">BRA-ti-sla-va</span>, <span class="sk">U-ni-ver-zi-ta</span>.</p>' +
        '<p>Ритмический закон: две долгие гласные подряд в слове не встречаются — вторая сокращается. Сравни:</p>' +
        '<ul>' +
        '<li><span class="sk">pekný chlapec</span> → <span class="sk">pekní chlapci</span> (в корне краткий гласный, окончание долгое -í);</li>' +
        '<li><span class="sk">krásny chlapec</span> → <span class="sk">krásni chlapci</span> (в корне уже долгое á, окончание сокращается до -i).</li>' +
        '</ul>'
    },
    {
      h: 'Глагол byť — «быть»',
      html: '<p>В словацком предложении глагол-связка <span class="sk">byť</span> обычно не опускается: <span class="sk">Som študent.</span> «Я студент».</p>' +
        '<p>Отрицание — просто <span class="sk">nie</span> перед глаголом: <span class="sk">Nie som študent.</span> «Я не студент».</p>' +
        '<div class="note">Вопросительный знак в речи — это интонация: <span class="sk">Si študent?</span> «Ты студент?». Порядок слов можно не менять.</div>'
    },
    {
      h: 'Местоимения и tykanie / vykanie',
      html: '<p>Личные местоимения: <span class="sk">ja</span> я, <span class="sk">ty</span> ты, <span class="sk">on</span> он, <span class="sk">ona</span> она, <span class="sk">ono</span> оно, <span class="sk">my</span> мы, <span class="sk">vy</span> вы, <span class="sk">oni</span> они (мужчины / смешанная группа), <span class="sk">ony</span> они (только женщины).</p>' +
        '<p><span class="sk">ty</span> — друзьям и близким, <span class="sk">vy</span> — незнакомым, старшим, официально (даже одному человеку). Поэтому: <span class="sk">Ako sa voláš?</span> — тебе, <span class="sk">Ako sa voláte?</span> — вам / вежливо.</p>'
    },
    {
      h: 'Приветствия и знакомство',
      html: '<p><span class="sk">Dobrý deň!</span> — здравствуйте (универсально). <span class="sk">Ahoj!</span> — привет (и при встрече, и на прощание, только «ты»).</p>' +
        '<p><span class="sk">Dobré ráno</span> — доброе утро, <span class="sk">Dobrý večer</span> — добрый вечер, <span class="sk">Dobrú noc</span> — доброй ночи, <span class="sk">Dovidenia</span> — до свидания, <span class="sk">Maj sa!</span> — пока (неформально).</p>' +
        '<p><span class="sk">Ďakujem</span> — спасибо, <span class="sk">Prosím</span> — пожалуйста. <span class="sk">Prepáčte</span> — извините (вежливо).</p>' +
        '<ul>' +
        '<li><span class="sk">Ako sa voláte?</span> — Как вас зовут? <span class="sk">Volám sa Peter.</span> — Меня зовут Петер.</li>' +
        '<li><span class="sk">Odkiaľ ste?</span> — Откуда вы? <span class="sk">Som zo Slovenska.</span> — Я из Словакии.</li>' +
        '<li><span class="sk">Ako sa máte?</span> — Как вы? <span class="sk">Mám sa dobre, ďakujem.</span> — У меня всё хорошо, спасибо.</li>' +
        '</ul>' +
        '<div class="note">Предлог «из»: <span class="sk">z</span> перед гласными и большинством согласных (<span class="sk">z Bratislavy</span>), но <span class="sk">zo</span> перед <span class="sk">s, š, z, ž</span> и перед сочетаниями согласных (<span class="sk">zo Slovenska</span>).</div>'
    }
  ],
  tables: [
    {
      title: 'byť — настоящее время',
      head: ['Лицо', 'Форма', 'Перевод'],
      rows: [
        ['ja', 'som', 'я есть'],
        ['ty', 'si', 'ты есть'],
        ['on / ona / ono', 'je', 'он / она / оно есть'],
        ['my', 'sme', 'мы есть'],
        ['vy', 'ste', 'вы есть'],
        ['oni / ony', 'sú', 'они есть']
      ]
    },
    {
      title: 'byť — отрицание',
      head: ['Лицо', 'Форма'],
      rows: [
        ['ja', 'nie som'],
        ['ty', 'nie si'],

<script>/* Slovenčina — offline PWA-курс. Без зависимостей. */
(function () {
  'use strict';

  var COURSE = window.COURSE || { units: [] };
  var SRS = window.SRS;
  var KEY = 'sk_progress_v1';
  var app = document.getElementById('app');
  var db = null;

  /* ---------- utils ---------- */
  function $(s, r) { return (r || document).querySelector(s); }
  function $$(s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); }
  function el(tag, cls, html) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (html != null) e.innerHTML = html;
    return e;
  }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function norm(s) {
    return String(s || '')
      .toLowerCase()
      .replace(/[.,!?;:„“"()\[\]]/g, ' ')
      .replace(/\s+/g, ' ')
      .trim();
  }
  function stripD(s) {
    return norm(s).normalize('NFD').replace(/[\u0300-\u036f]/g, '');
  }
  function shuffle(a) {
    a = a.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  var toastTimer = null;
  function toast(msg) {
    var t = $('#toast');
    if (!t) return;
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.classList.remove('show'); }, 2600);
  }

  /* ---------- storage ---------- */
  function defaultDB() {
    return {
      v: 1,
      created: SRS.todayStr(),
      cards: {},
      units: {},
      days: {},
      tests: [],
      stats: { byType: {}, ok: 0, bad: 0 },
      streak: { last: null, n: 0 },
      settings: { newPerDay: 20, ttsRate: 0.95 }
    };
  }

  var Store = {
    ok: true,
    data: null,
    load: function () {
      try {
        var raw = localStorage.getItem(KEY);
        this.data = raw ? JSON.parse(raw) : defaultDB();
      } catch (e) {
        this.ok = false;
        this.data = defaultDB();
      }
      var d = this.data;
      var def = defaultDB();
      for (var k in def) if (!(k in d)) d[k] = def[k];
      d.settings = Object.assign({}, def.settings, d.settings || {});
      d.stats = Object.assign({ byType: {}, ok: 0, bad: 0 }, d.stats || {});
      d.stats.byType = d.stats.byType || {};
      return this.data;
    },
    save: function () {
      if (!this.ok) return;
      try {
        localStorage.setItem(KEY, JSON.stringify(this.data));
      } catch (e) {
        this.ok = false;
        toast('Прогресс не сохраняется. Сделай экспорт в настройках!');
      }
    }
  };

  function ensureDay() {
    var t = SRS.todayStr();
    if (!db.days[t]) db.days[t] = { rev: 0, new: 0, ex: 0 };
    return db.days[t];
  }

  function bumpStreak() {
    var t = SRS.todayStr();
    if (db.streak.last === t) return;
    db.streak.n = (db.streak.last && SRS.addDays(db.streak.last, 1) === t) ? (db.streak.n || 0) + 1 : 1;
    db.streak.last = t;
  }

  /* ---------- TTS ---------- */
  var TTS = {
    voices: [],
    init: function () {
      if (!('speechSynthesis' in window)) return;
      var self = this;
      var load = function () { self.voices = window.speechSynthesis.getVoices() || []; };
      load();
      window.speechSynthesis.onvoiceschanged = load;
    },
    sk: function () {
      for (var i = 0; i < this.voices.length; i++) {
        if (/^sk/i.test(this.voices[i].lang)) return this.voices[i];
      }
      return null;
    },
    say: function (text, rate) {
      if (!('speechSynthesis' in window)) { toast('Синтез речи недоступен на этом устройстве'); return; }
      var u = new SpeechSynthesisUtterance(String(text));
      u.lang = 'sk-SK';
      u.rate = rate || db.settings.ttsRate || 0.95;
      var v = this.sk();
      if (v) u.voice = v;
      try { window.speechSynthesis.cancel(); window.speechSynthesis.speak(u); } catch (e) { toast('Не удалось озвучить'); }
    }
  };

  /* ---------- cards ---------- */
  function allCards() {
    var out = [];
    COURSE.units.slice().sort(function (a, b) { return a.n - b.n; }).forEach(function (u) {
      (u.vocab || []).forEach(function (v, i) {
        out.push({ key: u.n + ':' + i + ':skru', unit: u.n, kind: 'sk-ru', sk: v.sk, ru: v.ru, ex: v.ex, exRu: v.exRu });
        out.push({ key: u.n + ':' + i + ':rusk', unit: u.n, kind: 'ru-sk', sk: v.sk, ru: v.ru, ex: v.ex, exRu: v.exRu });
      });
    });
    return out;
  }

  function doneCount() {
    return COURSE.units.filter(function (u) { return db.units[u.n] && db.units[u.n].done; }).length;
  }
  function maxUnlocked() {
    return Math.min(COURSE.units.length, doneCount() + 2);
  }
  function dueCards() {
    var t = SRS.todayStr();
    return allCards().filter(function (c) {
      var st = db.cards[c.key];
      return st && st.due && st.due <= t;
    });
  }

  /* ---------- answers ---------- */
  function ansOk(ex, val) {
    var v = norm(val);
    if (!v) return { ok: false };
    var answers = ex.answers || [];
    for (var i = 0; i < answers.length; i++) if (norm(answers[i]) === v) return { ok: true };
    for (var j = 0; j < answers.length; j++) if (stripD(answers[j]) === stripD(val)) return { ok: true, near: true };
    return { ok: false };
  }

  /* ---------- unit stats ---------- */
  function unitStats(u) {
    var st = db.units[u.n] || { ex: {}, done: false };
    var keys = Object.keys(st.ex || {});
    var ok = keys.filter(function (k) { return st.ex[k].ok; }).length;
    var total = (u.exercises || []).length;
    return { attempted: keys.length, total: total, ok: ok, score: total ? ok / total : 0, done: !!st.done };
  }

  function record(u, idx, ok, ex) {
    if (QUIZ) {
      if (QUIZ.done[idx]) return;
      QUIZ.done[idx] = true;
      QUIZ.items[idx].ok = !!ok;
      QUIZ.answered += 1;
      var qt = ex.type || 'other';
      db.stats.byType[qt] = db.stats.byType[qt] || { ok: 0, bad: 0 };
      if (ok) { db.stats.byType[qt].ok++; db.stats.ok++; } else { db.stats.byType[qt].bad++; db.stats.bad++; }
      ensureDay().ex += 1;
      bumpStreak();
      Store.save();
      updateQuizUI();
      return;
    }
    var st = db.units[u.n];
    if (!st) return;
    var prev = st.ex[idx];
    st.ex[idx] = { ok: ok, tries: (prev ? prev.tries : 0) + 1 };
    var type = ex.type || 'other';
    db.stats.byType[type] = db.stats.byType[type] || { ok: 0, bad: 0 };
    if (ok) { db.stats.byType[type].ok++; db.stats.ok++; } else { db.stats.byType[type].bad++; db.stats.bad++; }
    ensureDay().ex += 1;
    bumpStreak();
    Store.save();
    refreshScore(u);
  }

  function refreshScore(u) {
    var s = unitStats(u);
    var sc = $('#uscore');
    if (sc) sc.textContent = s.ok + ' / ' + s.total;
    var bar = $('#ubar');
    if (bar) bar.style.width = (s.total ? Math.round(100 * s.ok / s.total) : 0) + '%';
  }

  /* ---------- views ---------- */
  function header() {
    var due = dueCards().length;
    return '<header class="hdr"><div class="brand">Sloven<span>čina</span></div>' +
      '<div class="row"><span class="chip">🔥 <b>' + (db.streak.n || 0) + '</b></span>' +
      '<span class="chip">⏳ <b>' + due + '</b></span></div></header>';
  }

  var NAV = [
    ['today', 'Dnes', '☀️'],
    ['course', 'Kurz', '📚'],
    ['review', 'Opakovanie', '🔄'],
    ['stats', 'Štatistiky', '📈'],
    ['settings', 'Nastavenia', '⚙️']
  ];

  function nav(active) {
    return '<nav class="nav">' + NAV.map(function (n) {
      return '<a href="#' + n[0] + '" class="' + (n[0] === active ? 'on' : '') + '">' +
        '<span class="ic">' + n[2] + '</span>' + n[1] + '</a>';
    }).join('') + '</nav>';
  }

  function render() {
    var route = (location.hash || '#today').replace(/^#\/?/, '');
    var parts = route.split('/');
    if (parts[0] !== 'test' && QUIZ) QUIZ = null;
    app.innerHTML = header() + '<main id="view"></main>' + nav(parts[0]) + '<div id="toast" class="toast"></div>';
    var v = $('#view');
    if (parts[0] === 'course') vCourse(v);
    else if (parts[0] === 'unit') vUnit(v, Number(parts[1]));
    else if (parts[0] === 'review') vReview(v);
    else if (parts[0] === 'stats') vStats(v);
    else if (parts[0] === 'settings') vSettings(v);
    else if (parts[0] === 'test') vTest(v);
    else if (parts[0] === 'listen') { if (parts[1]) vListenUnit(v, Number(parts[1])); else vListen(v); }
    else if (parts[0] === 'help') vHelp(v);
    else vToday(v);
    window.scrollTo(0, 0);
  }

  function vToday(v) {
    var t = SRS.todayStr();
    var day = db.days[t] || { rev: 0, new: 0, ex: 0 };
    var due = dueCards().length;
    var newLeft = Math.max(0, (db.settings.newPerDay || 20) - (day.new || 0));
    var units = COURSE.units.slice().sort(function (a, b) { return a.n - b.n; });
    var next = null;
    for (var i = 0; i < units.length; i++) { if (!(db.units[units[i].n] && db.units[units[i].n].done)) { next = units[i]; break; } }
    if (!next) next = units[units.length - 1];
    var doneN = doneCount();
    var pct = units.length ? Math.round(100 * doneN / units.length) : 0;
    var totalMin = (due * 0.35) + (newLeft * 0.4) + (next ? 30 : 0);

    var h = '';
    h += '<section class="card"><div class="row" style="justify-content:space-between">' +
      '<div><h1>Dnes</h1><div class="muted small">' + esc(t) + '</div></div>' +

  function finishUnit(u) {
    var s = unitStats(u);
    if (s.attempted < s.total) {
      toast('Сначала пройди все упражнения: ' + s.attempted + ' из ' + s.total);
      return;
    }
    if (s.score >= 0.7) {
      db.units[u.n].done = true;
      db.units[u.n].doneAt = SRS.todayStr();
      Store.save();
      toast('Юнит закрыт: ' + Math.round(s.score * 100) + '%. Tak ďalej!');
      location.hash = 'course';
    } else {
      db.units[u.n].done = false;
      Store.save();
      toast('Результат ' + Math.round(s.score * 100) + '% — нужно ≥70%. Повтори теорию и попробуй снова.');

  /* ---------- exercise binders ---------- */
  function bindExercise(box, ex, u, idx) {
    var type = ex.type || 'fill';
    if (type === 'choice') return exChoice(box, ex, u, idx);
    if (type === 'match') return exMatch(box, ex, u, idx);
    if (type === 'order') return exOrder(box, ex, u, idx);
    if (type === 'dictation') return exDictation(box, ex, u, idx);
    if (type === 'table') return exTable(box, ex, u, idx);
    return exFill(box, ex, u, idx);
  }

  function fbHTML(ok, answer, why) {
    var s = ok ? '✓ Верно' : '✗ Правильно: <b>' + esc(answer) + '</b>';
    return '<div class="fb ' + (ok ? 'ok' : 'bad') + '">' + s +
      (why ? '<span class="why">' + esc(why) + '</span>' : '') + '</div>';
  }

  function exChoice(box, ex, u, idx) {
    var h = '<div class="ex-q">' + ex.prompt + '</div><div class="opts"></div><div class="fb"></div>';
    box.innerHTML = h;
    var opts = $('.opts', box);
    var fb = $('.fb', box);
    var done = false;
    ex.options.forEach(function (o, i) {
      var b = el('button', 'opt', esc(o));
      b.onclick = function () {
        if (done) return;
        done = true;
        var ok = i === ex.correct;
        b.classList.add(ok ? 'good' : 'bad');
        if (!ok) opts.children[ex.correct].classList.add('good');
        fb.innerHTML = fbHTML(ok, ex.options[ex.correct], ex.why);
        record(u, idx, ok, ex);
      };
      opts.appendChild(b);
    });
  }

  function exFill(box, ex, u, idx) {
    box.innerHTML = '<div class="ex-q">' + ex.prompt + '</div>' +
      '<div class="row"><input class="inp" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="...">' +
      '<button class="btn sm">Проверить</button></div><div class="fb"></div>';
    var inp = $('.inp', box), btn = $('button', box), fb = $('.fb', box);
    var done = false;
    function go() {
      if (done) return;
      var r = ansOk(ex, inp.value);
      if (r.ok) {
        done = true;
        fb.innerHTML = fbHTML(true, ex.answers[0], ex.why) + (r.near ? '<span class="why">Диакритика: ' + esc(ex.answers[0]) + '</span>' : '');
        record(u, idx, true, ex);
      } else {
        fb.innerHTML = fbHTML(false, ex.answers[0], ex.why);
        record(u, idx, false, ex);
      }
    }
    btn.onclick = go;
    inp.addEventListener('keydown', function (e) { if (e.key === 'Enter') go(); });
  }

  function exMatch(box, ex, u, idx) {
    var pairs = ex.pairs || [];
    box.innerHTML = '<div class="ex-q">' + ex.prompt + '</div><div class="match"></div><div class="fb"></div>';
    var left = shuffle(pairs.map(function (p, i) { return { i: i, t: p[0] }; }));
    var right = shuffle(pairs.map(function (p, i) { return { i: i, t: p[1] }; }));
    var wrap = $('.match', box), fb = $('.fb', box);
    var sel = null, matched = 0, mistakes = 0, finished = false;
    left.forEach(function (L) {
      var b = el('button', 'mcell', esc(L.t));
      b.onclick = function () {
        if (finished || b.classList.contains('done')) return;
        if (sel) sel.classList.remove('sel');
        sel = b; b.classList.add('sel');
      };
      wrap.appendChild(b);
    });
    right.forEach(function (R) {
      var b = el('button', 'mcell', esc(R.t));
      b.onclick = function () {
        if (finished || !sel || b.classList.contains('done')) return;
        var li = Number(sel.getAttribute('data-i'));
        if (li === R.i) {
          sel.classList.add('done'); b.classList.add('done');
          sel.classList.remove('sel');
          matched++; sel = null;
          if (matched === pairs.length) {
            finished = true;
            fb.innerHTML = fbHTML(mistakes === 0, '', mistakes ? 'Были ошибки — повтори пары.' : '');
            record(u, idx, mistakes === 0, ex);
          }
        } else {
          mistakes++;
          b.classList.add('bad');
          setTimeout(function () { b.classList.remove('bad'); }, 450);
        }
      };
      wrap.appendChild(b);
    });
    $$('.mcell', wrap).forEach(function (b) {
      var txt = b.textContent;
      left.forEach(function (L) { if (L.t === txt && L.i >= 0) b.setAttribute('data-i', L.i); });
      right.forEach(function (R) { if (R.t === txt) b.setAttribute('data-i', R.i); });
    });
  }

  function exOrder(box, ex, u, idx) {
    box.innerHTML = '<div class="ex-q">' + ex.prompt + '</div><div class="answerline"></div>' +
      '<div class="chips"></div><div class="fb"></div>';
    var line = $('.answerline', box), chips = $('.chips', box), fb = $('.fb', box);
    var picked = [];
    var done = false;
    shuffle(ex.words || []).forEach(function (w) {
      var b = el('button', 'chipw', esc(w));
      b.onclick = function () {
        if (done) return;
        b.classList.add('used');
        var c = el('button', 'chipw', esc(w));
        c.onclick = function () {
          if (done) return;
          picked.splice(picked.indexOf(c), 1);
          c.remove();
          b.classList.remove('used');
        };
        line.appendChild(c);
        picked.push(c);
        check();
      };
      chips.appendChild(b);
    });
    function current() { return picked.map(function (c) { return c.textContent; }).join(' '); }
    function check() {
      if (picked.length !== (ex.words || []).length || done) return;
      var ok = norm(current()) === norm(ex.answer);
      done = true;
      fb.innerHTML = fbHTML(ok, ex.answer, ex.why);
      record(u, idx, ok, ex);
      if (!ok) {
        var btn = el('button', 'btn ghost sm', 'Ещё раз');
        btn.style.marginTop = '8px';
        btn.onclick = function () { render(); };
        fb.appendChild(btn);
      }
    }
  }

  function exDictation(box, ex, u, idx) {
    box.innerHTML = '<div class="ex-q">' + ex.prompt + '</div>' +
      '<div class="row" style="margin-bottom:8px"><button class="btn ghost sm">🔊 Слушать</button>' +
      '<span class="muted small">и запиши услышанное</span></div>' +
      '<div class="row"><input class="inp" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="...">' +
      '<button class="btn sm">Проверить</button></div><div class="fb"></div>';
    var inp = $('.inp', box), btns = $$('.btn', box), fb = $('.fb', box);
    var done = false;
    btns[0].onclick = function () { TTS.say(ex.text); };
    function go() {
      if (done) return;
      var r = ansOk({ answers: [ex.text] }, inp.value);
      if (r.ok) {
        done = true;
        fb.innerHTML = fbHTML(true, ex.text, ex.why);
        record(u, idx, true, ex);
      } else {
        fb.innerHTML = fbHTML(false, ex.text, ex.why);
        record(u, idx, false, ex);
      }
    }
    btns[1].onclick = go;
    inp.addEventListener('keydown', function (e) { if (e.key === 'Enter') go(); });
  }

  function exTable(box, ex, u, idx) {
    var rows = ex.rows || [];
    var h = '<div class="ex-q">' + ex.prompt + '</div>';
    rows.forEach(function (r, i) {
      h += '<div class="row" style="margin-bottom:8px"><span style="min-width:90px" class="muted">' + esc(r.l) + '</span>' +
        '<input class="inp" data-i="' + i + '" autocomplete="off" autocapitalize="off" spellcheck="false"></div>';
    });
    h += '<button class="btn sm" style="margin-top:6px">Проверить</button><div class="fb"></div>';
    box.innerHTML = h;
    var inputs = $$('.inp', box), btn = $('button', box), fb = $('.fb', box);
    var done = false;
    btn.onclick = function () {
      if (done) return;
      var bad = 0;
      inputs.forEach(function (inp, i) {
        var ok = norm(inp.value) === norm(rows[i].a) || stripD(inp.value) === stripD(rows[i].a);
        inp.style.borderColor = ok ? 'var(--ok)' : 'var(--bad)';
        if (!ok) bad++;
      });
      if (bad === 0) {
        done = true;
        fb.innerHTML = fbHTML(true, '', 'Отлично.');
        record(u, idx, true, ex);
      } else {
        fb.innerHTML = fbHTML(false, rows.map(function (r) { return r.a; }).join(' · '), ex.why);
        record(u, idx, false, ex);
      }
    };
  }

  /* ---------- review ---------- */
  var RS = null;
  var QUIZ = null;

  function startQuiz() {
    var attempted = COURSE.units.filter(function (u) {
      return db.units[u.n] && Object.keys(db.units[u.n].ex || {}).length > 0;
    });
    var base = attempted.length ? attempted : COURSE.units.slice(0, 2);
    var pool = [];
    base.forEach(function (u) {
      (u.exercises || []).forEach(function (ex, i) { pool.push({ u: u, i: i, ex: ex }); });
    });
    var pick = shuffle(pool).slice(0, 12);
    QUIZ = {
      items: pick.map(function (p) { return { u: p.u, i: p.i, ex: p.ex, ok: null }; }),
      done: {},
      answered: 0
    };
    location.hash = 'test';
    render();
  }

  function updateQuizUI() {
    var c = $('#qcount');
    if (c) c.textContent = QUIZ.answered + ' / ' + QUIZ.items.length;
    var b = $('#qbar');
    if (b) b.style.width = Math.round(100 * QUIZ.answered / QUIZ.items.length) + '%';
  }

  function vTest(v) {
    if (!QUIZ) {
      v.innerHTML = '<h1>Test</h1><div class="card"><b>Смешанный контрольный тест</b>' +
        '<div class="muted small" style="margin-top:6px">12 случайных заданий из пройденных юнитов. На каждое — одна попытка. Результат сохраняется в статистике.</div></div>' +
        '<button class="btn wide" id="qstart">Начать тест</button><a class="btn ghost wide" href="#course">К курсу</a>';
      $('#qstart').onclick = startQuiz;
      return;
    }
    var total = QUIZ.items.length;
    var h = '<h1>Test</h1><p class="muted small">Смешанные задания из пройденных юнитов. Одна попытка на задание.</p>' +
      '<div class="card"><div class="row" style="justify-content:space-between"><span class="muted">Отвечено</span><b id="qcount">' + QUIZ.answered + ' / ' + total + '</b></div>' +
      '<div class="bar"><i id="qbar" style="width:' + Math.round(100 * QUIZ.answered / total) + '%"></i></div></div>' +
      '<div id="exs"></div><button class="btn wide" id="qfinish">Завершить тест</button>';

      bindExercise(box, it.ex, it.u, idx);

  function finishQuiz() {
    var total = QUIZ.items.length;
    if (QUIZ.answered < total) {
      toast('Ответь на все задания: ' + QUIZ.answered + ' из ' + total);
      return;
    }
    var ok = QUIZ.items.filter(function (it) { return it.ok; }).length;
    db.tests = db.tests || [];
    db.tests.push({ d: SRS.todayStr(), ok: ok, total: total });
    Store.save();
    var pct = Math.round(100 * ok / total);
    var failed = QUIZ.items.filter(function (it) { return !it.ok; });
    var h = '<h1>Результат</h1><div class="card"><div style="font-size:40px;font-weight:700;line-height:1.1">' + pct + '%</div>' +
      '<div class="muted">' + ok + ' из ' + total + '</div>' +
      '<p style="margin-top:10px">' + (pct >= 70 ? 'Хороший результат — уровень держится.' : 'Ниже 70%: повтори темы с ошибками и пройди тест снова.') + '</p></div>';
    if (failed.length) {
      h += '<section class="sec"><h2>Что повторить</h2><ul class="ulist">';
      failed.forEach(function (it) {
        var txt = String(it.ex.prompt || '').replace(/<[^>]+>/g, '').slice(0, 90);
        h += '<li><a class="uitem" href="#unit/' + it.u.n + '"><span class="num">' + it.u.n + '</span>' +
          '<span><span class="tt">' + esc(it.u.title) + '</span><br><span class="sub">' + esc(txt) + '</span></span></a></li>';
      });
      h += '</ul></section>';
    }
    h += '<button class="btn wide" id="qagain">Пройти ещё раз</button><a class="btn ghost wide" href="#course">К курсу</a>';
    $('#view').innerHTML = h;
    QUIZ = null;
    $('#qagain').onclick = startQuiz;
  }

  function buildQueue() {
    var t = SRS.todayStr();
    var unlocked = maxUnlocked();
    var cards = allCards().filter(function (c) { return c.unit <= unlocked; });
    var due = cards.filter(function (c) {
      var st = db.cards[c.key];
      return st && st.due && st.due <= t;
    }).sort(function (a, b) { return String(db.cards[a.key].due).localeCompare(String(db.cards[b.key].due)); });
    var fresh = cards.filter(function (c) { return !db.cards[c.key] || !db.cards[c.key].due; });
    var introduced = (db.days[t] && db.days[t].new) || 0;
    var limit = Math.max(0, (db.settings.newPerDay || 20) - introduced);
    return { due: due, fresh: fresh.slice(0, limit), today: t };
  }

  function vReview(v) {
    var q = buildQueue();
    RS = { queue: q.due.concat(q.fresh), i: 0, revealed: false };
    if (!RS.queue.length) {
      v.innerHTML = '<h1>Opakovanie</h1><div class="card"><b>На сегодня всё ✓</b>' +
        '<div class="muted small">Новые карточки откроются с юнитами. Возвращайся завтра — SRS важнее зубрёжки.</div></div>' +
        '<a class="btn wide" href="#course">Перейти к курсу</a>';
      return;
    }
    renderCard(v);
  }

  function renderCard(v) {
    var c = RS.queue[RS.i];
    if (!c) { RS = null; vReview(v); return; }
    var st = db.cards[c.key];
    var isNew = !st || !st.due;
    var front = c.kind === 'sk-ru' ? c.sk : c.ru;
    var back = c.kind === 'sk-ru' ? c.ru : c.sk;
    var h = '<div class="rv-top"><span>' + (RS.i + 1) + ' / ' + RS.queue.length + '</span>' +
      '<span>' + (isNew ? 'новая' : 'повтор') + ' · ' + (c.kind === 'sk-ru' ? 'SK→RU' : 'RU→SK') + '</span></div>' +
      '<div class="rvcard"><div class="rv-front">' + esc(front) + '</div>';
    if (c.kind === 'ru-sk') h += '<input class="inp" id="rvin" placeholder="напиши по-словацки" autocomplete="off" spellcheck="false">';
    h += '<div id="rvback" class="hidden"><div class="rv-back">' + esc(back) + '</div>' +
      (c.ex ? '<div class="rv-ex">' + esc(c.ex) + (c.exRu ? '<br>' + esc(c.exRu) : '') + '</div>' : '') + '</div>' +
      '<div id="rvnote" class="small"></div></div>' +
      '<button class="btn wide" id="rvshow">Показать ответ</button>' +
      '<div class="grades hidden" id="rvg">' +
      '<button class="btn g-again" data-g="0">Снова</button>' +
      '<button class="btn g-good" data-g="1">Хорошо</button>' +
      '<button class="btn g-easy" data-g="2">Легко</button></div>';
    v.innerHTML = h;

    var show = function () {
      RS.revealed = true;
      $('#rvback').classList.remove('hidden');
      $('#rvshow').classList.add('hidden');
      $('#rvg').classList.remove('hidden');
      var inp = $('#rvin');
      if (inp && inp.value.trim()) {
        var ok = norm(inp.value) === norm(back) || stripD(inp.value) === stripD(back);
        $('#rvnote').innerHTML = ok ? '<span style="color:var(--ok)">✓ совпало</span>' : '<span style="color:var(--bad)">✗ было: ' + esc(back) + '</span>';
      }
    };
    $('#rvshow').onclick = show;

    $$('#rvg [data-g]', v).forEach(function (b) {
      b.onclick = function () {
        var g = Number(b.getAttribute('data-g'));
        var t = SRS.todayStr();
        var cur = db.cards[c.key] || SRS.newState();
        db.cards[c.key] = SRS.grade(cur, g, t);
        var day = ensureDay();
        if (isNew) day.new += 1; else day.rev += 1;
        bumpStreak();
        Store.save();
        RS.i++;
        renderCard(v);
      };
    });
  }

  /* ---------- stats ---------- */
  function vStats(v) {
    var cards = allCards();
    var introduced = cards.filter(function (c) { return db.cards[c.key] && db.cards[c.key].due; }).length;
    var total = db.stats.ok + db.stats.bad;
    var acc = total ? Math.round(100 * db.stats.ok / total) : 0;
    var days = Object.keys(db.days);
    var studied = days.filter(function (d) { return (db.days[d].rev || 0) + (db.days[d].new || 0) + (db.days[d].ex || 0) > 0; }).length;

    var h = '<h1>Štatistiky</h1>';
    h += '<div class="grid2">' +
      '<div class="stat"><b>' + (db.streak.n || 0) + '</b><span>дней подряд</span></div>' +
      '<div class="stat"><b>' + studied + '</b><span>дней занятий</span></div>' +
      '<div class="stat"><b>' + introduced + ' / ' + cards.length + '</b><span>карточек в работе</span></div>' +
      '<div class="stat"><b>' + acc + '%</b><span>точность упражнений</span></div>' +
      '</div>';

    h += '<section class="sec" style="margin-top:16px"><h2>Активность (14 дней)</h2><div class="heat">';
    for (var i = 13; i >= 0; i--) {
      var d = SRS.addDays(SRS.todayStr(), -i);
      var day = db.days[d];
      var n = day ? (day.rev || 0) + (day.new || 0) + (day.ex || 0) : 0;
      var lvl = n === 0 ? '' : (n < 10 ? 'l1' : (n < 30 ? 'l2' : 'l3'));
      h += '<i class="' + lvl + '" title="' + d + ': ' + n + '"></i>';
    }
    h += '</div><p class="muted small">Сегодня: ' + ((db.days[SRS.todayStr()] && ((db.days[SRS.todayStr()].rev || 0) + (db.days[SRS.todayStr()].new || 0) + (db.days[SRS.todayStr()].ex || 0))) || 0) + ' действий</p></section>';

    var by = db.stats.byType;
    var types = Object.keys(by);
    if (types.length) {
      h += '<section class="sec"><h2>По типам упражнений</h2><table class="tbl"><thead><tr><th>Тип</th><th>Верно</th><th>Ошибки</th></tr></thead><tbody>';
      types.forEach(function (t) {
        h += '<tr><td>' + t + '</td><td>' + by[t].ok + '</td><td>' + by[t].bad + '</td></tr>';
      });
      h += '</tbody></table></section>';
    }

    if (db.tests && db.tests.length) {
      h += '<section class="sec"><h2>Контрольные тесты</h2><table class="tbl"><thead><tr><th>Дата</th><th>Результат</th><th>%</th></tr></thead><tbody>';
      db.tests.slice(-8).reverse().forEach(function (t) {
        h += '<tr><td>' + esc(t.d) + '</td><td>' + t.ok + ' / ' + t.total + '</td><td>' + Math.round(100 * t.ok / t.total) + '%</td></tr>';
      });
      h += '</tbody></table></section>';
    }

    var units = COURSE.units.slice().sort(function (a, b) { return a.n - b.n; });
    h += '<section class="sec"><h2>Юниты</h2><ul class="ulist">';
    units.forEach(function (u) {
      var s = unitStats(u);
      h += '<li><a class="uitem ' + (s.done ? 'done' : '') + '" href="#unit/' + u.n + '"><span class="num">' + (s.done ? '✓' : u.n) + '</span>' +
        '<span><span class="tt">' + esc(u.title) + '</span><br><span class="sub">' + (s.done ? 'закрыт' : 'в процессе') + '</span></span>' +
        '<span class="st">' + Math.round(s.score * 100) + '%</span></a></li>';
    });
    h += '</ul></section>';
    v.innerHTML = h;
  }

  /* ---------- settings ---------- */
  function download(name, text, mime) {
    var blob = new Blob([text], { type: mime || 'text/plain;charset=utf-8' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name;
    document.body.appendChild(a);
    a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
  }

  function ankiCSV() {
    var rows = ['#separator:Semicolon', '#html:true'];
    COURSE.units.slice().sort(function (a, b) { return a.n - b.n; }).forEach(function (u) {
      (u.vocab || []).forEach(function (v) {
        var back = v.ru + (v.ex ? '<br><i>' + v.ex + '</i>' + (v.exRu ? '<br>' + v.exRu : '') : '');
        rows.push([v.sk, back, 'sk_unit_' + u.n].join(';'));
      });
    });
    return rows.join('\n');
  }

      Store.save();
      render();
      toast('Прогресс сброшен');
    };
  }

  /* ---------- boot ---------- */
  function boot() {
    COURSE.units = (COURSE.units || []).slice().sort(function (a, b) { return a.n - b.n; });
    db = Store.load();
    TTS.init();
    window.addEventListener('hashchange', render);
    if (!location.hash) location.hash = 'today';
    render();
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  });
}
</script>
</body>
